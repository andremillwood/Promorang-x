name: Community Partner foundation checks
on:
  pull_request:
    paths:
      - 'backend/services/partnerOutcomeVerification.js'
      - 'backend/__tests__/partnerOutcomeVerification.test.js'
      - 'backend/services/partnerOrderAdapter.js'
      - 'backend/__tests__/partnerOrderAdapter.test.js'
      - 'supabase/migrations/202611060002_partner_outcomes_foundation.sql'
      - '.github/workflows/community-partner-checks.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  node-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - run: node --test backend/__tests__/partnerOutcomeVerification.test.js backend/__tests__/partnerOrderAdapter.test.js
