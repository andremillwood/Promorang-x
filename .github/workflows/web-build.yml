name: Web Build

on:
  pull_request:
    paths:
      - "apps/web/**"
      - "packages/shared/**"
      - "packages/ui-tokens/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/web-build.yml"

jobs:
  build-web:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install
        run: npm ci --legacy-peer-deps

      - name: Test public market continuity
        shell: bash
        run: |
          set +e
          output=$(npm run test --workspace apps/web -- --maxWorkers=1 --minWorkers=1 src/lib/public-object-continuity.test.ts src/lib/resumable-intent.test.ts 2>&1)
          status=$?
          printf '%s\n' "$output"
          if [ "$status" -ne 0 ]; then
            annotation=$(printf '%s' "$output" | tail -c 6000 | sed -e 's/%/%25/g' -e 's/\r/%0D/g' -e ':a;N;$!ba;s/\n/%0A/g')
            echo "::error title=Public market continuity failure::$annotation"
            exit "$status"
          fi

      - name: Test Find-or-Ask routing
        run: |
          npm run test --workspace packages/shared -- --maxWorkers=1 --minWorkers=1 tests/find-or-ask.test.ts
          npm run test --workspace apps/web -- --maxWorkers=1 --minWorkers=1 \
            src/lib/discovery-signal.test.ts \
            src/lib/find-or-ask-routing.test.ts \
            src/lib/find-or-ask-stakeholder.test.ts \
            src/lib/find-or-ask-origin.test.ts \
            src/lib/find-or-ask-journey.integration.test.ts

      - name: Build web
        run: npm run build --workspace apps/web

      - name: Browser verify Find-or-Ask
        shell: bash
        run: |
          npm run preview --workspace apps/web -- --host 127.0.0.1 --port 4173 > /tmp/promorang-preview.log 2>&1 &
          preview_pid=$!
          trap 'kill "$preview_pid" || true' EXIT
          ready=0
          for attempt in {1..30}; do
            if curl -fsS http://127.0.0.1:4173/search >/dev/null; then
              ready=1
              break
            fi
            sleep 1
          done
          if [ "$ready" -ne 1 ]; then
            cat /tmp/promorang-preview.log
            exit 1
          fi
          node apps/web/scripts/verify-find-or-ask-browser.mjs
