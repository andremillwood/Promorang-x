name: Stakeholder Ops Validate

on:
  pull_request:
    paths:
      - "apps/web/**"
      - "backend/**"
      - "supabase/migrations/**"
      - "packages/shared/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/stakeholder-ops-validate.yml"

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install
        run: npm install --legacy-peer-deps

      - name: Canonical event contract tests
        run: npm exec --workspace backend -- jest tests/unit/canonicalEventService.test.js tests/unit/canonicalEventPersistence.test.js tests/unit/canonicalReconciliationService.test.js tests/unit/offerAtomicBoundaries.test.js --runInBand

      - name: Build web
        run: npm run build --workspace apps/web
