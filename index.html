<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta property="og:title" content="Promorang" />
    <meta property="og:description" content="Social media monetization platform for creators and brands" />
    <meta
      property="og:image"
      content="https://www.promorang.co/og-image.png"
      type="image/png"
    />
    <meta
      property="og:url"
      content="https://www.promorang.co/"
    />
    <meta property="og:type" content="website" />
    <meta property="og:author" content="Promorang" />
    <meta property="og:site_name" content="Promorang" />
    <meta property="twitter:card" content="summary_large_image" />
    <meta property="twitter:site" content="@promorang" />
    <meta property="twitter:title" content="Promorang" />
    <meta property="twitter:description" content="Social media monetization platform for creators and brands" />
    <meta
      property="twitter:image"
      content="https://www.promorang.co/og-image.png"
      type="image/png"
    />
    <link
      rel="shortcut icon"
      href="/favicon.png"
      type="image/png"
    />
    <link
      rel="apple-touch-icon"
      sizes="180x180"
      href="/apple-touch-icon.png"
      type="image/png"
    />
    <meta name="description" content="Promorang - Earn rewards through social engagement and content creation" />
    <meta name="keywords" content="social media, rewards, content creation, engagement, earn money online" />
    <title>Promorang - Earn Through Social Engagement</title>
  </head>
  <body>
    <div id="root"></div>
    <script>
      // Dynamic viewport height calculation for mobile
      function setVH() {
        const vh = window.innerHeight * 0.01;
        document.documentElement.style.setProperty('--vh', `${vh}px`);
      }
      setVH();
      window.addEventListener('resize', setVH);
      window.addEventListener('orientationchange', setVH);
    </script>
    <script type="module" src="/src/react-app/main.tsx"></script>
  </body>
</html>
